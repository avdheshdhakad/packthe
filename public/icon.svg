<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Shield Glow -->
  <path d="M 256 64 C 360 64 416 100 416 192 C 416 320 256 424 256 424 C 256 424 96 320 96 192 C 96 100 152 64 256 64 Z" 
        fill="url(#shieldGrad)" />

  <!-- Shield Border -->
  <path d="M 256 72 C 352 72 404 106 404 192 C 404 312 256 410 256 410 C 256 410 108 312 108 192 C 108 106 160 72 256 72 Z" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />

  <!-- Checkmark / Inspection Tick -->
  <path d="M 180 236 L 232 288 L 336 172" 
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Scan Target Reticle Corners -->
  <path d="M 160 144 L 140 144 L 140 164" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
  <path d="M 352 144 L 372 144 L 372 164" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
  <path d="M 140 280 L 140 300 L 160 300" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
  <path d="M 372 280 L 372 300 L 352 300" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />

  <!-- Tricolor Inspection Ribbon Base -->
  <g transform="translate(196, 444)">
    <rect x="0" y="0" width="40" height="8" rx="3" fill="#FF9933" />
    <rect x="40" y="0" width="40" height="8" rx="0" fill="#FFFFFF" />
    <rect x="80" y="0" width="40" height="8" rx="3" fill="#138808" />
  </g>
</svg>
