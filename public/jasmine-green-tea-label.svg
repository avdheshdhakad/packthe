<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7F5" />
      <stop offset="100%" stop-color="#E9EFEA" />
    </linearGradient>

    <linearGradient id="boxFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23532b" />
      <stop offset="40%" stop-color="#183e20" />
      <stop offset="100%" stop-color="#0f2814" />
    </linearGradient>

    <linearGradient id="boxSideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16381d" />
      <stop offset="100%" stop-color="#1f4e27" />
    </linearGradient>

    <linearGradient id="boxTopGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2e6b37" />
      <stop offset="100%" stop-color="#3e884b" />
    </linearGradient>

    <linearGradient id="teaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2e88a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4b5563" stop-opacity="0.15" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <filter id="boxShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="-5" dy="14" stdDeviation="10" flood-color="#051808" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" fill="url(#bgGrad)" />

  <!-- Projection Ray / Zoom Cone -->
  <polygon points="120,380 360,70 360,390 120,410" fill="url(#beamGrad)" />
  <line x1="120" y1="380" x2="360" y2="70" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" stroke-opacity="0.7" />
  <line x1="120" y1="410" x2="360" y2="390" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" stroke-opacity="0.7" />

  <!-- 3D Tea Box -->
  <g filter="url(#boxShadow)">
    <!-- Box Top Face -->
    <polygon points="25,48 135,32 300,52 190,68" fill="url(#boxTopGrad)" stroke="#40824b" stroke-width="1" />

    <!-- Box Side Face (Left) -->
    <polygon points="25,48 190,68 190,415 25,395" fill="url(#boxSideGrad)" stroke="#133319" stroke-width="1" />

    <!-- Side Panel Content -->
    <!-- Mini Logo -->
    <text x="38" y="82" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#dcfce7">Organic</text>
    <text x="38" y="102" font-family="Impact, Arial Black, sans-serif" font-size="18" fill="#86efac" letter-spacing="1">Green</text>
    <text x="38" y="120" font-family="Impact, Arial Black, sans-serif" font-size="18" fill="#4ade80" letter-spacing="1">Tea</text>

    <!-- Side Panel Description Body -->
    <text x="34" y="145" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0" font-weight="bold">Endow your spirits with</text>
    <text x="34" y="156" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">our energizing blend of</text>
    <text x="34" y="167" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">organic Ginseng, Blackberry</text>
    <text x="34" y="178" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">leaves, Nettle leaves with</text>
    <text x="34" y="189" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">aromatic Lemongrass,</text>
    <text x="34" y="200" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">Spearmint and Peppermint,</text>
    <text x="34" y="211" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">in harmony with subtle</text>
    <text x="34" y="222" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">undertones of organic</text>
    <text x="34" y="233" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">Elderflower, Ginger and</text>
    <text x="34" y="244" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">Cinnamon. The deep aromatic</text>
    <text x="34" y="255" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">flavours of this tea will be</text>
    <text x="34" y="266" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">sure to put the spring</text>
    <text x="34" y="277" font-family="Arial, sans-serif" font-size="6.8" fill="#bbf7d0">back in your step.</text>

    <!-- Side Statutory Mini Label (Where the zoom originates) -->
    <rect x="35" y="365" width="75" height="35" rx="2" fill="#ffffff" opacity="0.95" />
    <rect x="38" y="368" width="12" height="12" fill="#1e293b" />
    <text x="53" y="373" font-family="monospace" font-size="4.5" fill="#000" font-weight="bold">MRP: 69.00</text>
    <text x="53" y="378" font-family="monospace" font-size="4.5" fill="#000">PKD: 07/16</text>
    <text x="53" y="383" font-family="monospace" font-size="4.5" fill="#000">Net: 500g</text>
    <!-- mini barcode bars -->
    <g transform="translate(38, 386)">
      <rect x="0" y="0" width="1.5" height="9" fill="#000" />
      <rect x="3" y="0" width="1" height="9" fill="#000" />
      <rect x="5" y="0" width="2" height="9" fill="#000" />
      <rect x="9" y="0" width="1.5" height="9" fill="#000" />
      <rect x="12" y="0" width="3" height="9" fill="#000" />
      <rect x="17" y="0" width="1" height="9" fill="#000" />
      <rect x="20" y="0" width="2" height="9" fill="#000" />
      <rect x="24" y="0" width="1.5" height="9" fill="#000" />
      <rect x="28" y="0" width="3" height="9" fill="#000" />
      <rect x="33" y="0" width="1" height="9" fill="#000" />
      <rect x="36" y="0" width="2.5" height="9" fill="#000" />
      <rect x="41" y="0" width="1.5" height="9" fill="#000" />
      <rect x="45" y="0" width="2" height="9" fill="#000" />
      <rect x="49" y="0" width="1.5" height="9" fill="#000" />
      <rect x="53" y="0" width="3" height="9" fill="#000" />
      <rect x="58" y="0" width="1" height="9" fill="#000" />
      <rect x="61" y="0" width="2" height="9" fill="#000" />
      <rect x="65" y="0" width="1.5" height="9" fill="#000" />
      <text x="16" y="13" font-family="monospace" font-size="4" fill="#000">0 12345 67890 5</text>
    </g>

    <!-- Box Front Face -->
    <polygon points="190,68 300,52 300,398 190,415" fill="url(#boxFrontGrad)" stroke="#1c4d26" stroke-width="1" />

    <!-- Front Face Artwork & Content -->
    <!-- Teacup and foliage visual -->
    <g transform="translate(195, 75)">
      <!-- Title -->
      <text x="48" y="25" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#fef08a">Jasmine</text>
      <text x="48" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#a3e635" letter-spacing="0.5">Green</text>
      <text x="48" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#84cc16" letter-spacing="0.5">Tea</text>

      <!-- Tea Cup & Leaves illustration -->
      <circle cx="48" cy="155" r="38" fill="#ffffff" opacity="0.15" />
      <ellipse cx="48" cy="165" rx="34" ry="18" fill="#facc15" opacity="0.85" />
      <ellipse cx="48" cy="165" rx="30" ry="14" fill="#ca8a04" />
      <ellipse cx="48" cy="165" rx="26" ry="10" fill="#84cc16" opacity="0.7" />
      
      <!-- Lemon slice inside cup -->
      <circle cx="55" cy="165" r="10" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />
      <line x1="55" y1="155" x2="55" y2="175" stroke="#ca8a04" stroke-width="1" />
      <line x1="45" y1="165" x2="65" y2="165" stroke="#ca8a04" stroke-width="1" />

      <!-- Mint / Jasmine Leaves -->
      <path d="M30,140 C20,125 35,110 50,120 C45,135 35,145 30,140 Z" fill="#4ade80" />
      <path d="M50,120 C65,110 80,125 70,140 C65,145 55,135 50,120 Z" fill="#22c55e" />
      <circle cx="48" cy="128" r="3" fill="#ffffff" />

      <!-- Glass cup body -->
      <path d="M20,165 C20,195 32,220 48,220 C64,220 76,195 76,165 Z" fill="url(#teaGlow)" opacity="0.75" stroke="#fef08a" stroke-width="1.5" />
      <!-- Saucer -->
      <ellipse cx="48" cy="222" rx="40" ry="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />

      <!-- Fresh berries / garnish at base -->
      <circle cx="32" cy="225" r="5" fill="#1e1b4b" />
      <circle cx="38" cy="226" r="4" fill="#312e81" />
      <circle cx="30" cy="228" r="3.5" fill="#09090b" />

      <text x="48" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#dcfce7" letter-spacing="1">PREMIUM BLEND</text>
      <text x="48" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#86efac">NET WT. 500g</text>
    </g>
  </g>

  <!-- Right Side Enlarged Verification Label Panel -->
  <g filter="url(#cardShadow)">
    <!-- Dark Green Outer Container -->
    <rect x="360" y="70" width="530" height="320" rx="6" fill="#2f5937" stroke="#1c3a22" stroke-width="2" />

    <!-- Inner White Statutory Label Card -->
    <rect x="380" y="90" width="490" height="280" rx="4" fill="#ffffff" />

    <!-- Top Section: QR Code (Left) & Declarations (Right) -->
    <!-- QR Code Container -->
    <g transform="translate(400, 105)">
      <!-- Outer box -->
      <rect x="0" y="0" width="85" height="85" fill="#ffffff" stroke="#000000" stroke-width="1" />

      <!-- QR Corner Finder 1 (Top-Left) -->
      <rect x="4" y="4" width="24" height="24" fill="#000000" />
      <rect x="8" y="8" width="16" height="16" fill="#ffffff" />
      <rect x="11" y="11" width="10" height="10" fill="#000000" />

      <!-- QR Corner Finder 2 (Top-Right) -->
      <rect x="57" y="4" width="24" height="24" fill="#000000" />
      <rect x="61" y="8" width="16" height="16" fill="#ffffff" />
      <rect x="64" y="11" width="10" height="10" fill="#000000" />

      <!-- QR Corner Finder 3 (Bottom-Left) -->
      <rect x="4" y="57" width="24" height="24" fill="#000000" />
      <rect x="8" y="61" width="16" height="16" fill="#ffffff" />
      <rect x="11" y="64" width="10" height="10" fill="#000000" />

      <!-- Timing / Alignment Patterns -->
      <rect x="32" y="10" width="4" height="4" fill="#000000" />
      <rect x="40" y="10" width="4" height="4" fill="#000000" />
      <rect x="48" y="10" width="4" height="4" fill="#000000" />

      <rect x="10" y="32" width="4" height="4" fill="#000000" />
      <rect x="10" y="40" width="4" height="4" fill="#000000" />
      <rect x="10" y="48" width="4" height="4" fill="#000000" />

      <!-- Data matrix modules -->
      <rect x="32" y="32" width="7" height="7" fill="#000000" />
      <rect x="43" y="32" width="7" height="7" fill="#000000" />
      <rect x="36" y="43" width="6" height="6" fill="#000000" />
      <rect x="46" y="43" width="8" height="6" fill="#000000" />
      <rect x="32" y="53" width="8" height="5" fill="#000000" />
      <rect x="44" y="53" width="6" height="7" fill="#000000" />
      <rect x="54" y="32" width="6" height="6" fill="#000000" />
      <rect x="64" y="32" width="7" height="7" fill="#000000" />
      <rect x="58" y="42" width="8" height="8" fill="#000000" />
      <rect x="70" y="44" width="7" height="7" fill="#000000" />
      <rect x="58" y="56" width="8" height="6" fill="#000000" />
      <rect x="70" y="56" width="7" height="8" fill="#000000" />
      <rect x="32" y="65" width="6" height="6" fill="#000000" />
      <rect x="42" y="65" width="8" height="6" fill="#000000" />
      <rect x="54" y="66" width="7" height="8" fill="#000000" />
      <rect x="65" y="68" width="8" height="7" fill="#000000" />
      <rect x="34" y="75" width="6" height="6" fill="#000000" />
      <rect x="44" y="74" width="8" height="6" fill="#000000" />
      <rect x="56" y="77" width="6" height="4" fill="#000000" />
      <rect x="66" y="77" width="8" height="4" fill="#000000" />
      <rect x="77" y="68" width="4" height="8" fill="#000000" />
    </g>

    <!-- Top Right: Legal Metrology PCR 2011 Declarations -->
    <g transform="translate(510, 110)">
      <!-- MRP Line -->
      <text x="0" y="20" font-family="'Courier New', Courier, monospace, Arial" font-size="18" font-weight="bold" fill="#0f172a">
        MRP (Incl of all Taxes)
      </text>
      <text x="240" y="20" font-family="'Courier New', Courier, monospace, Arial" font-size="18" font-weight="bold" fill="#0f172a">
        :  69.00
      </text>

      <!-- PKD Line -->
      <text x="0" y="48" font-family="'Courier New', Courier, monospace, Arial" font-size="18" font-weight="bold" fill="#0f172a">
        PKD
      </text>
      <text x="240" y="48" font-family="'Courier New', Courier, monospace, Arial" font-size="18" font-weight="bold" fill="#0f172a">
        :  07/2016
      </text>

      <!-- Net Weight Line -->
      <text x="0" y="76" font-family="'Courier New', Courier, monospace, Arial" font-size="18" font-weight="bold" fill="#0f172a">
        Net Weight
      </text>
      <text x="240" y="76" font-family="'Courier New', Courier, monospace, Arial" font-size="18" font-weight="bold" fill="#0f172a">
        :  500g
      </text>
    </g>

    <!-- Bottom Section: High Precision 1D Barcode (UPC-A 012345678905) -->
    <g transform="translate(445, 215)">
      <!-- Outer Guard Bars (Left) -->
      <rect x="0" y="0" width="3" height="105" fill="#000000" />
      <rect x="6" y="0" width="3" height="105" fill="#000000" />

      <!-- Left Data Bars (height 90) -->
      <rect x="15" y="0" width="5" height="90" fill="#000000" />
      <rect x="23" y="0" width="3" height="90" fill="#000000" />
      <rect x="30" y="0" width="7" height="90" fill="#000000" />
      <rect x="41" y="0" width="4" height="90" fill="#000000" />
      <rect x="49" y="0" width="2" height="90" fill="#000000" />
      <rect x="54" y="0" width="6" height="90" fill="#000000" />
      <rect x="64" y="0" width="4" height="90" fill="#000000" />
      <rect x="72" y="0" width="7" height="90" fill="#000000" />
      <rect x="83" y="0" width="3" height="90" fill="#000000" />
      <rect x="89" y="0" width="6" height="90" fill="#000000" />
      <rect x="99" y="0" width="2" height="90" fill="#000000" />
      <rect x="104" y="0" width="7" height="90" fill="#000000" />
      <rect x="115" y="0" width="4" height="90" fill="#000000" />
      <rect x="122" y="0" width="4" height="90" fill="#000000" />
      <rect x="130" y="0" width="7" height="90" fill="#000000" />
      <rect x="141" y="0" width="3" height="90" fill="#000000" />
      <rect x="148" y="0" width="5" height="90" fill="#000000" />
      <rect x="157" y="0" width="6" height="90" fill="#000000" />

      <!-- Center Guard Bars (Taller: height 105) -->
      <rect x="170" y="0" width="3" height="105" fill="#000000" />
      <rect x="176" y="0" width="3" height="105" fill="#000000" />

      <!-- Right Data Bars (height 90) -->
      <rect x="186" y="0" width="4" height="90" fill="#000000" />
      <rect x="194" y="0" width="7" height="90" fill="#000000" />
      <rect x="205" y="0" width="3" height="90" fill="#000000" />
      <rect x="212" y="0" width="6" height="90" fill="#000000" />
      <rect x="222" y="0" width="2" height="90" fill="#000000" />
      <rect x="228" y="0" width="7" height="90" fill="#000000" />
      <rect x="239" y="0" width="4" height="90" fill="#000000" />
      <rect x="247" y="0" width="5" height="90" fill="#000000" />
      <rect x="256" y="0" width="6" height="90" fill="#000000" />
      <rect x="266" y="0" width="3" height="90" fill="#000000" />
      <rect x="273" y="0" width="7" height="90" fill="#000000" />
      <rect x="284" y="0" width="4" height="90" fill="#000000" />
      <rect x="292" y="0" width="2" height="90" fill="#000000" />
      <rect x="298" y="0" width="6" height="90" fill="#000000" />
      <rect x="308" y="0" width="5" height="90" fill="#000000" />
      <rect x="317" y="0" width="3" height="90" fill="#000000" />
      <rect x="324" y="0" width="7" height="90" fill="#000000" />
      <rect x="335" y="0" width="4" height="90" fill="#000000" />

      <!-- End Guard Bars (Taller: height 105) -->
      <rect x="345" y="0" width="3" height="105" fill="#000000" />
      <rect x="351" y="0" width="3" height="105" fill="#000000" />

      <!-- Barcode Text Digits (Matching 0 12345 67890 5) -->
      <text x="-16" y="112" font-family="'Courier New', monospace, Arial" font-size="24" font-weight="bold" fill="#000000">0</text>
      <text x="36" y="112" font-family="'Courier New', monospace, Arial" font-size="24" font-weight="bold" fill="#000000" letter-spacing="6">12345</text>
      <text x="206" y="112" font-family="'Courier New', monospace, Arial" font-size="24" font-weight="bold" fill="#000000" letter-spacing="6">67890</text>
      <text x="364" y="112" font-family="'Courier New', monospace, Arial" font-size="24" font-weight="bold" fill="#000000">5</text>
    </g>
  </g>
</svg>